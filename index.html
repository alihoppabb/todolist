<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фокус — рабочий планировщик</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✳️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1F5; --card:#FFFFFF; --ink:#0F1B2D; --ink2:#54637A; --line:rgba(15,27,45,.15);
    --amber:#FFB424; --coral:#E5484D; --green:#12A06B; --blue:#2E63E0; --orange:#F59E0B;
    --disp:'Unbounded',sans-serif; --body:'Golos Text',sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--body); color:var(--ink); background:var(--paper); min-height:100vh;
    background-image:
      radial-gradient(900px 500px at 88% -10%, rgba(255,180,36,.20), transparent 60%),
      radial-gradient(800px 520px at -12% 108%, rgba(18,160,107,.14), transparent 60%),
      repeating-linear-gradient(0deg, rgba(15,27,45,.035) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(15,27,45,.035) 0 1px, transparent 1px 34px);
    background-attachment:fixed;
  }
  ::selection{background:var(--amber); color:var(--ink)}
  button{font-family:inherit; cursor:pointer}
  input,select{font-family:inherit}

  .float{position:fixed; pointer-events:none; z-index:0; opacity:.5}
  .f1{width:150px;height:150px;border:2px dashed rgba(15,27,45,.18);border-radius:50%;top:14%;right:6%;animation:spin 60s linear infinite}
  .f2{width:84px;height:84px;border:2px solid rgba(229,72,77,.28);border-radius:20px;bottom:10%;left:4%;animation:floaty 11s ease-in-out infinite alternate}
  .f3{width:16px;height:16px;background:var(--amber);border:2px solid var(--ink);border-radius:50%;top:56%;left:2.5%;animation:floaty 8s ease-in-out infinite alternate-reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes floaty{from{transform:translateY(-12px) rotate(0)}to{transform:translateY(14px) rotate(14deg)}}

  .app{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:34px 24px 60px}

  .head{display:flex; justify-content:space-between; align-items:flex-start; gap:24px; margin-bottom:30px; animation:rise .6s cubic-bezier(.2,.9,.3,1) both}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--disp); font-weight:800; font-size:15px; letter-spacing:.06em}
  .brand-star{display:inline-grid; place-items:center; width:32px; height:32px; background:var(--ink); color:var(--amber); border-radius:10px; font-size:17px; animation:spin 24s linear infinite}
  .brand-sub{font-family:var(--mono); font-weight:600; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink2); border:1.5px solid var(--line); padding:4px 9px; border-radius:99px; background:var(--card)}
  .greet{font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink2); margin:20px 0 6px}
  .date-big{font-family:var(--disp); font-weight:800; font-size:clamp(30px,4.8vw,52px); line-height:1.08; letter-spacing:-.01em}
  .date-big mark{background:linear-gradient(180deg, transparent 58%, var(--amber) 58%); padding:0 6px; border-radius:3px; color:inherit}
  .head-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; align-items:center}
  .clock{display:inline-flex; align-items:baseline; gap:1px; background:var(--ink); color:#fff; font-family:var(--mono); font-weight:600; font-size:14px; padding:8px 14px; border-radius:10px; box-shadow:3px 3px 0 rgba(15,27,45,.22)}
  .clock b{font-weight:600}
  .cblink{animation:blink 1s steps(1) infinite; color:var(--amber)}
  @keyframes blink{50%{opacity:.15}}
  .hchip{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; background:var(--card); border:1.5px solid var(--line); padding:8px 12px; border-radius:10px; color:var(--ink2)}
  .hchip.warn{color:var(--coral); border-color:rgba(229,72,77,.4)}
  .stamp{flex:none; width:136px; height:136px; margin-top:8px; animation:spin 26s linear infinite}
  @keyframes rise{from{opacity:0; transform:translateY(18px)}to{opacity:1; transform:none}}

  .layout{display:grid; grid-template-columns:284px 1fr; gap:26px; align-items:start}
  .card{background:var(--card); border:1.5px solid var(--line); border-radius:16px; box-shadow:0 1px 2px rgba(15,27,45,.05), 0 14px 30px -20px rgba(15,27,45,.25)}

  .side{position:sticky; top:22px; display:flex; flex-direction:column; gap:16px; animation:rise .6s .08s cubic-bezier(.2,.9,.3,1) both}
  .progress-card{padding:18px; display:flex; gap:16px; align-items:center}
  .ring-wrap{position:relative; width:96px; height:96px; flex:none}
  .ring-wrap svg{transform:rotate(-90deg)}
  .ring-bg{stroke:rgba(15,27,45,.1)}
  .ring-fg{stroke:var(--amber); transition:stroke-dashoffset .8s cubic-bezier(.2,.9,.3,1)}
  .ring-num{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--disp); font-weight:800; font-size:19px}
  .p-info{display:flex; flex-direction:column; gap:4px; min-width:0}
  .p-info b{font-size:15px}
  .p-info span{font-size:13px; color:var(--ink2)}
  .p-phrase{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--green); font-weight:600}
  .lists-card{padding:14px}
  .side-title{font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.24em; text-transform:uppercase; color:var(--ink2); padding:2px 8px 10px}
  .l-item{display:flex; align-items:center; gap:10px; width:100%; border:0; background:transparent; padding:9px 10px; border-radius:10px; font-size:14px; font-weight:600; color:var(--ink); text-align:left; transition:background .18s, transform .18s}
  .l-item:hover{background:rgba(15,27,45,.05); transform:translateX(3px)}
  .l-item .dot{width:11px; height:11px; border-radius:4px; flex:none; box-shadow:0 0 0 2px rgba(15,27,45,.12)}
  .l-item .l-name{flex:1}
  .l-item .cnt{font-family:var(--mono); font-size:11px; font-weight:700; background:rgba(15,27,45,.08); padding:2px 8px; border-radius:99px; color:var(--ink2)}
  .l-item.active{background:var(--ink); color:#fff}
  .l-item.active .cnt{background:var(--amber); color:var(--ink)}
  .tip{padding:14px 16px; font-size:12.5px; line-height:1.55; color:var(--ink2); border-left:4px solid var(--amber)}
  .tip b{color:var(--ink)}

  .main{display:flex; flex-direction:column; gap:16px; min-width:0; animation:rise .6s .14s cubic-bezier(.2,.9,.3,1) both}
  .composer{padding:16px}
  .c-row1{display:flex; align-items:center; gap:12px}
  .plus{flex:none; display:grid; place-items:center; width:40px; height:40px; border-radius:12px; background:var(--amber); border:2px solid var(--ink); font-size:24px; font-weight:700; box-shadow:3px 3px 0 var(--ink); transition:transform .2s}
  .composer:focus-within .plus{transform:rotate(90deg)}
  #titleInp{flex:1; min-width:120px; border:0; outline:0; background:transparent; font-size:18px; font-weight:600; color:var(--ink); padding:8px 0}
  #titleInp::placeholder{color:#9AA6B8; font-weight:500}
  .btn-add{display:inline-flex; align-items:center; gap:9px; background:var(--amber); color:var(--ink); border:2px solid var(--ink); border-radius:12px; padding:12px 18px; font-family:var(--disp); font-weight:700; font-size:12.5px; letter-spacing:.04em; box-shadow:4px 4px 0 var(--ink); transition:transform .15s, box-shadow .15s}
  .btn-add:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink)}
  .btn-add:active{transform:translate(1px,1px); box-shadow:2px 2px 0 var(--ink)}
  .btn-key{font-family:var(--mono); font-size:10px; background:rgba(15,27,45,.14); padding:2px 6px; border-radius:6px}
  .c-row2{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-top:13px; padding-top:13px; border-top:1.5px dashed var(--line)}
  .quick{display:flex; gap:8px; flex-wrap:wrap}
  .qchip{border:1.5px solid var(--line); background:transparent; border-radius:99px; padding:6px 13px; font-size:12.5px; font-weight:600; color:var(--ink2); transition:all .18s}
  .qchip:hover{border-color:var(--ink); color:var(--ink); transform:translateY(-1px)}
  .qchip.on{background:var(--ink); border-color:var(--ink); color:#fff}
  .c-right{display:flex; gap:9px; flex-wrap:wrap; align-items:center}
  .seg{display:flex; background:rgba(15,27,45,.06); border-radius:10px; padding:3px}
  .seg button{border:0; background:transparent; padding:6px 11px; font-size:12px; font-weight:600; color:var(--ink2); border-radius:8px; transition:all .18s}
  .seg button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(15,27,45,.2)}
  .seg button[data-p="high"].on{color:var(--coral)}
  select,#dateInp{border:1.5px solid var(--line); border-radius:10px; padding:8px 11px; font-size:13px; font-weight:600; color:var(--ink); background:#fff; outline:0; transition:border-color .18s}
  select:focus,#dateInp:focus{border-color:var(--ink)}
  .shake{animation:shake .35s}
  @keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

  .toolbar{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center}
  .chips{display:flex; gap:8px; flex-wrap:wrap}
  .chip{border:1.5px solid var(--line); background:var(--card); border-radius:99px; padding:8px 15px; font-size:13px; font-weight:600; color:var(--ink2); transition:all .18s}
  .chip:hover{border-color:var(--ink); color:var(--ink); transform:translateY(-1px)}
  .chip.on{background:var(--ink); border-color:var(--ink); color:#fff; box-shadow:3px 3px 0 rgba(15,27,45,.2)}
  .search{display:flex; align-items:center; gap:8px; background:var(--card); border:1.5px solid var(--line); border-radius:99px; padding:8px 15px; transition:border-color .18s, box-shadow .18s}
  .search:focus-within{border-color:var(--ink); box-shadow:3px 3px 0 rgba(15,27,45,.15)}
  .search input{border:0; outline:0; background:transparent; font-size:13.5px; width:170px}
  .search svg{flex:none; stroke:var(--ink2)}

  .board-head{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--ink2); margin:4px 2px 0}

  .tasks{list-style:none; display:flex; flex-direction:column; gap:10px; margin-top:10px}
  .task{display:flex; align-items:flex-start; gap:12px; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:13px 14px; position:relative; transition:transform .2s, box-shadow .2s, border-color .2s, opacity .35s; animation:taskIn .45s cubic-bezier(.2,.9,.3,1) both}
  @keyframes taskIn{from{opacity:0; transform:translateY(-12px) scale(.98)}to{opacity:1; transform:none}}
  .task:hover{transform:translateY(-2px); border-color:rgba(15,27,45,.4); box-shadow:0 10px 22px -14px rgba(15,27,45,.35)}
  .task::before{content:''; position:absolute; left:-1.5px; top:10px; bottom:10px; width:4px; border-radius:0 4px 4px 0; background:var(--pc,transparent)}
  .task.flash{animation:flash .9s ease-out}
  @keyframes flash{0%{background:#FFF0C9; border-color:var(--amber)}100%{background:#fff}}
  .task.dragging{opacity:.4; transform:scale(.98)}
  .task.over{border-color:var(--amber); box-shadow:0 0 0 3px rgba(255,180,36,.35)}
  .handle{flex:none; color:#B7C0CC; font-size:15px; line-height:1; padding:4px 0; cursor:grab; user-select:none; transition:color .18s}
  .handle:hover{color:var(--ink)}
  .handle:active{cursor:grabbing}
  .check{flex:none; width:26px; height:26px; margin-top:2px; border:2px solid var(--ink); border-radius:9px; background:#fff; display:grid; place-items:center; transition:background .25s, transform .15s}
  .check:hover{transform:scale(1.12)}
  .check svg{width:15px; height:15px; fill:none; stroke:#fff; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:22; stroke-dashoffset:22; transition:stroke-dashoffset .3s ease .05s}
  .is-done .check{background:var(--green); border-color:var(--green)}
  .is-done .check svg{stroke-dashoffset:0}
  .t-body{flex:1; min-width:0}
  .ttl{font-size:15.5px; font-weight:600; line-height:1.4; position:relative; display:inline; word-break:break-word; cursor:text}
  .ttl::after{content:''; position:absolute; left:0; top:56%; height:2px; width:0; background:var(--green); transition:width .35s ease}
  .is-done .ttl{color:var(--ink2)}
  .is-done .ttl::after{width:100%}
  .edit-in{width:100%; font-size:15.5px; font-weight:600; border:0; outline:0; border-bottom:2px solid var(--amber); background:transparent; padding:0 0 2px}
  .meta{display:flex; gap:7px; flex-wrap:wrap; margin-top:7px}
  .m{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; padding:3.5px 9px; border-radius:99px; background:rgba(15,27,45,.055); color:var(--ink2)}
  .m i{width:8px; height:8px; border-radius:3px; display:inline-block}
  .m-prio i{background:var(--pc)}
  .m-date svg{width:11px; height:11px; stroke:currentColor; fill:none; stroke-width:2}
  .m-date.over{background:rgba(229,72,77,.12); color:var(--coral)}
  .acts{display:flex; gap:6px; opacity:0; transform:translateX(6px); transition:opacity .2s, transform .2s}
  .task:hover .acts{opacity:1; transform:none}
  .act{width:30px; height:30px; border:1.5px solid transparent; background:transparent; border-radius:9px; display:grid; place-items:center; color:var(--ink2); transition:all .18s}
  .act svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .act:hover{background:rgba(15,27,45,.07); color:var(--ink); border-color:var(--line)}
  .act-del:hover{background:rgba(229,72,77,.1); color:var(--coral); border-color:rgba(229,72,77,.35)}
  .is-done{opacity:.62}
  .is-done:hover{opacity:.9}

  .done-head{display:flex; align-items:center; gap:12px; margin-top:22px; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--ink2)}
  .done-head::before,.done-head::after{content:''; flex:1; height:1.5px; background:var(--line)}
  .done-head button{border:0; background:transparent; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--coral); text-decoration:underline; text-underline-offset:3px}
  .done-head button:hover{color:var(--ink)}

  .empty{text-align:center; padding:48px 20px 30px; animation:rise .5s both}
  .empty svg{margin-bottom:18px}
  .empty-title{font-family:var(--disp); font-weight:700; font-size:20px; margin-bottom:8px}
  .empty-sub{color:var(--ink2); font-size:14.5px; max-width:380px; margin:0 auto; line-height:1.5}

  .foot{text-align:center; font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--ink2); margin-top:44px}

  .toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,140%); background:var(--ink); color:#fff; border-radius:13px; padding:13px 18px; display:flex; align-items:center; gap:16px; font-size:14px; font-weight:500; box-shadow:0 14px 40px -10px rgba(15,27,45,.5); transition:transform .4s cubic-bezier(.2,.9,.3,1); z-index:60; max-width:90vw}
  .toast.show{transform:translate(-50%,0)}
  .toast button{border:0; background:var(--amber); color:var(--ink); font-weight:700; border-radius:8px; padding:7px 14px; font-size:13px}
  #confetti{position:fixed; inset:0; pointer-events:none; z-index:99; overflow:hidden}
  #confetti i{position:absolute; top:-14px; display:block; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}

  @media (max-width:920px){
    .layout{grid-template-columns:1fr}
    .side{position:static}
    .lists-card{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
    .side-title{width:100%}
    .l-item{width:auto}
    .stamp{display:none}
  }
  @media (max-width:560px){
    .acts{opacity:1; transform:none}
    .c-row1{flex-wrap:wrap}
    .search input{width:120px}
  }
</style>
</head>
<body>
  <div class="float f1"></div><div class="float f2"></div><div class="float f3"></div>

  <div class="app">
    <header class="head">
      <div>
        <div class="brand"><span class="brand-star">✳</span>ФОКУС <span class="brand-sub">рабочий планировщик</span></div>
        <p class="greet" id="greet"></p>
        <h1 class="date-big" id="dateBig"></h1>
        <div class="head-row">
          <div class="clock" id="clock"></div>
          <span class="hchip" id="chipToday">сегодня · 0</span>
          <span class="hchip warn" id="chipOver" hidden>просрочено · 0</span>
        </div>
      </div>
      <svg class="stamp" viewBox="0 0 136 136" aria-hidden="true">
        <defs><path id="cir" d="M68,68 m-52,0 a52,52 0 1,1 104,0 a52,52 0 1,1 -104,0"/></defs>
        <circle cx="68" cy="68" r="66" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
        <circle cx="68" cy="68" r="38" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 5"/>
        <text font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="3.2" fill="var(--ink)" font-weight="600">
          <textPath href="#cir">✳ ДЕЛАЙ · ПЛАНИРУЙ · ЗАВЕРШАЙ ·</textPath>
        </text>
        <text x="68" y="76" text-anchor="middle" font-size="24">✳</text>
      </svg>
    </header>

    <div class="layout">
      <aside class="side">
        <div class="card progress-card">
          <div class="ring-wrap">
            <svg width="96" height="96" viewBox="0 0 120 120">
              <circle class="ring-bg" cx="60" cy="60" r="52" fill="none" stroke-width="11"/>
              <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52" fill="none" stroke-width="11" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
            </svg>
            <div class="ring-num" id="ringNum">0%</div>
          </div>
          <div class="p-info">
            <b>Прогресс</b>
            <span id="pCount">0 из 0</span>
            <span class="p-phrase" id="pPhrase"></span>
          </div>
        </div>

        <div class="card lists-card">
          <div class="side-title">Списки</div>
          <div id="listsBox" style="display:contents"></div>
        </div>

        <div class="card tip">
          <b>Подсказки:</b> ⏎ — добавить · двойной клик по тексту — редактировать · тяни за ⠿, чтобы поменять порядок · <b>/</b> — поиск
        </div>
      </aside>

      <main class="main">
        <form class="card composer" id="composer" autocomplete="off">
          <div class="c-row1">
            <span class="plus">+</span>
            <input id="titleInp" type="text" maxlength="140" placeholder="Что нужно сделать? Например: отправить отчёт до пятницы">
            <button class="btn-add" type="submit">Добавить <span class="btn-key">⏎</span></button>
          </div>
          <div class="c-row2">
            <div class="quick">
              <button type="button" class="qchip" data-q="today">Сегодня</button>
              <button type="button" class="qchip" data-q="tomorrow">Завтра</button>
              <button type="button" class="qchip" data-q="clear" id="qClear" hidden>✕ убрать дату</button>
            </div>
            <div class="c-right">
              <div class="seg" id="seg">
                <button type="button" data-p="low">Низкий</button>
                <button type="button" data-p="mid" class="on">Средний</button>
                <button type="button" data-p="high">Срочно</button>
              </div>
              <select id="selList"></select>
              <input type="date" id="dateInp" title="Срок">
            </div>
          </div>
        </form>

        <div class="toolbar">
          <div class="chips" id="filterChips">
            <button class="chip on" data-f="all">Все</button>
            <button class="chip" data-f="today">Сегодня</button>
            <button class="chip" data-f="plan">Запланировано</button>
            <button class="chip" data-f="done">Готово</button>
          </div>
          <label class="search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="searchInp" type="text" placeholder="Поиск…  ( / )">
          </label>
        </div>

        <div class="board-head" id="boardHead"></div>
        <ul class="tasks" id="taskList"></ul>

        <div class="empty" id="empty" hidden>
          <svg width="118" height="118" viewBox="0 0 120 120" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round">
            <rect x="25" y="24" width="70" height="84" rx="10"/>
            <rect x="42" y="15" width="36" height="17" rx="6" fill="var(--amber)"/>
            <path d="M38 52h30M38 68h44M38 84h20"/>
            <circle cx="85" cy="88" r="15" fill="#fff"/>
            <path d="m79 88 4.5 4.5L93 83" stroke="var(--green)" stroke-width="4"/>
          </svg>
          <div class="empty-title" id="emptyTitle"></div>
          <div class="empty-sub" id="emptySub"></div>
        </div>

        <div id="doneBlock" hidden>
          <div class="done-head">
            <span>Готово · <b id="doneCnt">0</b></span>
            <button id="clearDone" type="button">очистить</button>
          </div>
          <ul class="tasks" id="doneList"></ul>
        </div>
      </main>
    </div>

    <footer class="foot">данные хранятся в облаке и локально · фокус © 2026</footer>
  </div>

  <div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>
  <div id="confetti"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const LS = 'focus.planner.v1';

  const LISTS = {
    work:     {name:'Работа',   color:'#2E63E0'},
    meetings: {name:'Встречи',  color:'#E5484D'},
    personal: {name:'Личное',   color:'#12A06B'},
    ideas:    {name:'Идеи',     color:'#F59E0B'}
  };
  const PRIO = {
    low:  {label:'низкий',  color:'#9AA6B8'},
    mid:  {label:'средний', color:'#F59E0B'},
    high: {label:'срочно',  color:'#E5484D'}
  };
  const FILTER_LABEL = {all:'Все активные', today:'Сегодня', plan:'Запланировано', done:'Выполненные'};

  const iso = d => { const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); };
  const todayStr = () => iso(new Date());
  const addDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return iso(d); };
  const fmtShort = s => new Date(s+'T00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'});

  let state = { tasks: load(), list:'all', filter:'all', q:'' };
  let composer = { list:'work', priority:'mid', date:'' };
  let flashId = null, dragId = null, toastTimer = null;

  function load(){
    try{ const raw = localStorage.getItem(LS); if(raw) return JSON.parse(raw); }catch(e){}
    const t = todayStr();
    return [
      {id:uid(), title:'Разобрать входящие и ответить на письма', done:false, priority:'mid',  list:'work',     date:t,       created:Date.now()},
      {id:uid(), title:'Подготовить повестку созвона команды',    done:false, priority:'high', list:'meetings', date:t,       created:Date.now()},
      {id:uid(), title:'Черновик презентации для клиента',        done:false, priority:'high', list:'work',     date:addDays(1), created:Date.now()},
      {id:uid(), title:'Записаться на английский',                done:false, priority:'low',  list:'personal', date:null,    created:Date.now()},
      {id:uid(), title:'Составить план спринта',                  done:true,  priority:'mid',  list:'work',     date:null,    created:Date.now()}
    ];
  }
  function save(){
    try{ localStorage.setItem(LS, JSON.stringify(state.tasks)); }catch(e){}
    if(window.__cloudRef){ window.__cloudRef.set({ tasks: state.tasks }).catch(function(){}); }
  }
  function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id'+Date.now()+Math.random()); }
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function setDate(){
    const d = new Date(), h = d.getHours();
    const g = h>=5&&h<12 ? 'Доброе утро' : h>=12&&h<17 ? 'Добрый день' : h>=17&&h<23 ? 'Добрый вечер' : 'Доброй ночи';
    $('#greet').textContent = g + ' · спланируем день';
    const wd = d.toLocaleDateString('ru-RU',{weekday:'long'});
    const md = d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
    $('#dateBig').innerHTML = wd.charAt(0).toUpperCase()+wd.slice(1) + ', <mark>' + md + '</mark>';
  }
  function tick(){
    const d = new Date(), p = n=>String(n).padStart(2,'0');
    $('#clock').innerHTML = '<b>'+p(d.getHours())+'</b><span class="cblink">:</span><b>'+p(d.getMinutes())+'</b><span class="cblink">:</span><b>'+p(d.getSeconds())+'</b>';
  }

  function buildLists(){
    const box = $('#listsBox');
    let html = '<button class="l-item active" data-list="all"><span class="dot" style="background:var(--ink)"></span><span class="l-name">Все списки</span><span class="cnt" data-cnt="all">0</span></button>';
    for(const k in LISTS){
      html += '<button class="l-item" data-list="'+k+'"><span class="dot" style="background:'+LISTS[k].color+'"></span><span class="l-name">'+LISTS[k].name+'</span><span class="cnt" data-cnt="'+k+'">0</span></button>';
    }
    box.innerHTML = html;
    box.addEventListener('click', e=>{
      const b = e.target.closest('.l-item'); if(!b) return;
      state.list = b.dataset.list;
      $$('.l-item').forEach(x=>x.classList.toggle('active', x===b));
      render();
    });
  }
  function buildSelList(){
    $('#selList').innerHTML = Object.keys(LISTS).map(k=>'<option value="'+k+'">'+LISTS[k].name+'</option>').join('');
    $('#selList').value = composer.list;
  }

  function inScope(t){
    if(state.list!=='all' && t.list!==state.list) return false;
    if(state.q && !t.title.toLowerCase().includes(state.q.trim().toLowerCase())) return false;
    return true;
  }
  function dateMatch(t){
    const f = state.filter, td = todayStr();
    if(f==='today') return t.date===td;
    if(f==='plan')  return !!t.date && t.date>=td;
    return true;
  }

  function dateMeta(t){
    if(!t.date) return null;
    const td = todayStr();
    let label = t.date===td ? 'Сегодня' : t.date===addDays(1) ? 'Завтра' : t.date===addDays(-1) ? 'Вчера' : fmtShort(t.date);
    const over = !t.done && t.date < td;
    return { label:(over?'просрочено · ':'')+label, cls: over?'over':'' };
  }
  function taskHTML(t){
    const dm = dateMeta(t);
    return '<li class="task'+(t.done?' is-done':'')+'" data-id="'+t.id+'" style="--pc:'+PRIO[t.priority].color+'">'
      + '<span class="handle" title="Перетащить">⠿</span>'
      + '<button class="check" role="checkbox" aria-checked="'+t.done+'" title="Отметить"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></button>'
      + '<div class="t-body">'
      +   '<span class="ttl">'+esc(t.title)+'</span>'
      +   '<div class="meta">'
      +     '<span class="m"><i style="background:'+LISTS[t.list].color+'"></i>'+LISTS[t.list].name+'</span>'
      +     (dm ? '<span class="m m-date '+dm.cls+'"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'+dm.label+'</span>' : '')
      +     '<span class="m m-prio"><i></i>'+PRIO[t.priority].label+'</span>'
      +   '</div>'
      + '</div>'
      + '<div class="acts">'
      +   '<button class="act act-edit" title="Редактировать"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>'
      +   '<button class="act act-del" title="Удалить"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button>'
      + '</div></li>';
  }

  function bindTask(li, t){
    li.querySelector('.check').addEventListener('click', ()=>toggle(t.id));
    li.querySelector('.act-del').addEventListener('click', ()=>delTask(t.id));
    li.querySelector('.act-edit').addEventListener('click', ()=>editTask(t.id, li));
    li.querySelector('.ttl').addEventListener('dblclick', ()=>editTask(t.id, li));
    const handle = li.querySelector('.handle');
    handle.addEventListener('mousedown', ()=>{ li.draggable = true; });
    li.addEventListener('dragstart', e=>{
      if(!li.draggable){ e.preventDefault(); return; }
      dragId = t.id; e.dataTransfer.effectAllowed = 'move';
      setTimeout(()=>li.classList.add('dragging'), 0);
    });
    li.addEventListener('dragend', ()=>{ li.draggable=false; li.classList.remove('dragging','over'); dragId=null; });
    li.addEventListener('dragover', e=>{ if(dragId && dragId!==t.id){ e.preventDefault(); li.classList.add('over'); } });
    li.addEventListener('dragleave', ()=>li.classList.remove('over'));
    li.addEventListener('drop', e=>{ e.preventDefault(); reorder(dragId, t.id); });
  }

  function reorder(fromId, toId){
    if(!fromId || fromId===toId) return;
    const arr = state.tasks;
    const i = arr.findIndex(x=>x.id===fromId);
    const item = arr.splice(i,1)[0];
    const j = arr.findIndex(x=>x.id===toId);
    arr.splice(j,0,item);
    flashId = fromId; save(); render();
  }

  function toggle(id){
    const openBefore = state.tasks.filter(t=>!t.done).length;
    const t = state.tasks.find(x=>x.id===id); if(!t) return;
    t.done = !t.done;
    if(t.done) t.doneAt = Date.now();
    save(); render();
    if(t.done && openBefore===1 && state.tasks.length>1) confetti();
  }
  function delTask(id){
    const i = state.tasks.findIndex(x=>x.id===id); if(i<0) return;
    const removed = state.tasks.splice(i,1)[0];
    save(); render();
    toast('Задача удалена', 'Отменить', ()=>{ state.tasks.splice(i,0,removed); save(); flashId=removed.id; render(); });
  }
  function editTask(id, li){
    const t = state.tasks.find(x=>x.id===id); if(!t) return;
    const span = li.querySelector('.ttl'); if(!span) return;
    const inp = document.createElement('input');
    inp.className='edit-in'; inp.value=t.title; inp.maxLength=140;
    span.replaceWith(inp); inp.focus(); inp.select();
    let done=false;
    const commit = cancel=>{
      if(done) return; done=true;
      const v = inp.value.trim();
      if(!cancel && v && v!==t.title){ t.title=v; save(); }
      render();
    };
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter') commit(false);
      if(e.key==='Escape') commit(true);
      e.stopPropagation();
    });
    inp.addEventListener('blur', ()=>commit(false));
  }

  function render(){
    const ul = $('#taskList'), dl = $('#doneList');
    const isDoneView = state.filter==='done';

    const active = state.tasks.filter(t=>!t.done && inScope(t) && dateMatch(t));
    const doneArr = state.tasks.filter(t=>t.done && inScope(t)).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));

    ul.innerHTML = isDoneView ? '' : active.map(taskHTML).join('');
    dl.innerHTML = doneArr.map(taskHTML).join('');

    [...ul.children, ...dl.children].forEach(li=>{
      const t = state.tasks.find(x=>x.id===li.dataset.id);
      if(t) bindTask(li, t);
      if(li.dataset.id===flashId){ li.classList.add('flash'); }
    });
    flashId = null;

    $('#doneBlock').hidden = doneArr.length===0;
    $('#doneCnt').textContent = doneArr.length;
    $('#boardHead').textContent = isDoneView
      ? 'Готово · ' + doneArr.length
      : FILTER_LABEL[state.filter] + ' · ' + active.length;

    const empty = $('#empty');
    const nothing = (isDoneView ? doneArr.length : active.length + doneArr.length) === 0;
    empty.hidden = !nothing;
    if(nothing){
      if(state.tasks.length===0){
        $('#emptyTitle').textContent = 'Пока пусто';
        $('#emptySub').textContent = 'Добавьте первую задачу выше — она сохранится для вашего рабочего дня.';
      } else {
        $('#emptyTitle').textContent = 'Здесь ничего нет';
        $('#emptySub').textContent = 'Попробуйте другой фильтр или добавьте новую задачу.';
      }
    }

    updateSide(); updateHeaderChips();
  }

  function updateSide(){
    const open = state.tasks.filter(t=>!t.done);
    $$('[data-cnt]').forEach(el=>{
      const k = el.dataset.cnt;
      el.textContent = k==='all' ? open.length : open.filter(t=>t.list===k).length;
    });
    const scope = state.tasks.filter(t=>state.list==='all' || t.list===state.list);
    const total = scope.length, done = scope.filter(t=>t.done).length;
    const pct = total ? done/total : 0, C = 326.7;
    $('#ringFg').style.strokeDashoffset = C*(1-pct);
    $('#ringFg').style.stroke = pct>=1 && total>0 ? 'var(--green)' : 'var(--amber)';
    $('#ringNum').textContent = Math.round(pct*100)+'%';
    $('#pCount').textContent = done + ' из ' + total;
    $('#pPhrase').textContent = total===0 ? 'начнём!' : pct===1 ? 'всё сделано 🎉' : pct<.5 ? 'хороший старт' : 'уже близко!';
  }

  function updateHeaderChips(){
    const td = todayStr();
    const open = state.tasks.filter(t=>!t.done);
    const todayN = open.filter(t=>t.date===td).length;
    const overN  = open.filter(t=>t.date && t.date<td).length;
    $('#chipToday').textContent = 'сегодня · ' + todayN;
    $('#chipOver').hidden = overN===0;
    $('#chipOver').textContent = 'просрочено · ' + overN;
  }

  function toast(msg, actLabel, actFn){
    const t = $('#toast');
    $('#toastMsg').textContent = msg;
    const btn = $('#toastAct');
    btn.hidden = !actLabel;
    btn.textContent = actLabel || '';
    btn.onclick = ()=>{ if(actFn) actFn(); t.classList.remove('show'); };
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 5000);
  }

  function confetti(){
    const box = $('#confetti');
    const colors = ['#FFB424','#E5484D','#2E63E0','#12A06B','#0F1B2D'];
    for(let i=0;i<90;i++){
      const p = document.createElement('i');
      const s = 6+Math.random()*7;
      p.style.cssText = 'left:'+(Math.random()*100)+'vw;width:'+s+'px;height:'+s+'px;background:'+colors[i%5]
        + (i%3?';border-radius:2px':';border-radius:50%')
        + ';animation-duration:'+(1.8+Math.random()*1.6)+'s;animation-delay:'+(Math.random()*0.4)+'s';
      box.appendChild(p);
    }
    setTimeout(()=>{ box.innerHTML=''; }, 4200);
  }

  function syncQuick(){
    composer.date = $('#dateInp').value;
    $$('.qchip[data-q]').forEach(b=>{
      const q = b.dataset.q;
      const v = q==='today' ? todayStr() : q==='tomorrow' ? addDays(1) : null;
      b.classList.toggle('on', !!v && composer.date===v);
    });
    $('#qClear').hidden = !composer.date;
  }

  $('#composer').addEventListener('submit', e=>{
    e.preventDefault();
    const inp = $('#titleInp');
    const v = inp.value.trim();
    if(!v){ inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.focus(); return; }
    const t = { id:uid(), title:v, done:false, priority:composer.priority, list:composer.list, date:composer.date||null, created:Date.now() };
    state.tasks.push(t);
    flashId = t.id;
    inp.value = ''; $('#dateInp').value=''; syncQuick(); inp.focus();
    save(); render();
  });

  $('#dateInp').addEventListener('change', syncQuick);
  $$('.qchip').forEach(b=>b.addEventListener('click', ()=>{
    const q = b.dataset.q;
    $('#dateInp').value = q==='today' ? todayStr() : q==='tomorrow' ? addDays(1) : '';
    syncQuick(); $('#titleInp').focus();
  }));
  $('#seg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    composer.priority = b.dataset.p;
    $$('#seg button').forEach(x=>x.classList.toggle('on', x===b));
  });
  $('#selList').addEventListener('change', e=>{ composer.list = e.target.value; });

  $('#filterChips').addEventListener('click', e=>{
    const b = e.target.closest('.chip'); if(!b) return;
    state.filter = b.dataset.f;
    $$('#filterChips .chip').forEach(x=>x.classList.toggle('on', x===b));
    render();
  });
  $('#searchInp').addEventListener('input', e=>{ state.q = e.target.value; render(); });
  document.addEventListener('keydown', e=>{
    const tag = document.activeElement && document.activeElement.tagName;
    if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(tag)){ e.preventDefault(); $('#searchInp').focus(); }
    if(e.key==='Escape' && document.activeElement===$('#searchInp')){ $('#searchInp').value=''; state.q=''; render(); document.activeElement.blur(); }
  });

  $('#clearDone').addEventListener('click', ()=>{
    const removed = state.tasks.filter(t=>t.done);
    if(!removed.length) return;
    state.tasks = state.tasks.filter(t=>!t.done);
    save(); render();
    toast('Очищено задач: ' + removed.length, 'Отменить', ()=>{ state.tasks.push(...removed); save(); render(); });
  });

  let curDay = todayStr();
  setInterval(()=>{ tick(); if(todayStr()!==curDay){ curDay=todayStr(); setDate(); render(); } }, 1000);

  /* ── старт ── */
  setDate(); tick(); buildLists(); buildSelList(); render();
  $('#titleInp').focus();

  /* ============================================================
     СИНХРОНИЗАЦИЯ ▼▼▼
     Замени шесть строк "ВСТАВЬ_СЮДА" на свой блок firebaseConfig,
     скопированный из Firebase (Project settings → Your apps)
     ============================================================ */
  try{
    const firebaseConfig = {
      apiKey: "AIzaSyBHQOc7gWOlTFdJ37-0FgJ6wYKDE-yXojo",
      authDomain: "my-todo-eead0.firebaseapp.com",
      projectId: "my-todo-eead0",
      storageBucket: "my-todo-eead0.firebasestorage.app",
      messagingSenderId: "93201171571",
      appId: "1:93201171571:web:eab3623044e4a248e1d606",
      measurementId: "G-DLM75CNSBB"
    };
    firebase.initializeApp(firebaseConfig);
    const __ref = firebase.firestore().collection('todolist').doc('state');
    window.__cloudRef = __ref;
    __ref.onSnapshot(function(snap){
      if(snap.exists){ state.tasks = snap.data().tasks || []; }
      else { __ref.set({ tasks: state.tasks }); }
      try{ localStorage.setItem(LS, JSON.stringify(state.tasks)); }catch(e){}
      render();
    }, function(){});
  }catch(e){ console.warn('Синхронизация не подключилась:', e); }
})();
</script>
</body>
</html>
